<!DOCTYPE html>
<html lang="en">

<head>
    {% include head.html %}
</head>

<body>
    {% include navbar.html %}

    <main id="main-content">
    <section class="hero is-fullheight listing-page" id="blog">
        <div class="hero-body">
            <div class="container">
                <h1 class="title is-1">{{page.title | default: "Posts"}}</h1>
                {% include blogpage-heading.html %}
            </div>
        </div>
        <div id="results-container" role="status" aria-live="polite"></div>
        <div class="container blog-cards">
        <!--Blog Cards Section-->
        {% for post in site.posts %}
        {% include blog-card.html %}
        {% endfor %}
        </div>
    </section>
    </main>
    <!--Footer begins here-->
    {% include footer.html %}
    <script>
        const searchInput = document.getElementById('search-input');
        const blogCards = document.querySelectorAll('.blog-card');
        const searchButton = document.getElementById('search-btn');

        searchInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                event.preventDefault();
                searchButton.click();
            }
        });

        searchInput.addEventListener('input', () => {
            if (searchInput.value === '') searchButton.click();
        });

        searchButton.addEventListener('click', () => {
            const query = searchInput.value.trim().toLowerCase();
            let matches = 0;
            blogCards.forEach(card => {
                const title = card.querySelector('h2').textContent.toLowerCase();
                const content = card.querySelector('.content').textContent.toLowerCase();
                if (title.includes(query) || content.includes(query)) {
                    card.style.display = '';
                    matches++;
                } else {
                    card.style.display = 'none';
                }
            });
            document.getElementById('results-container').textContent = matches === 0 ? 'No posts found. Try a different search.' : '';
        });

    </script>
</body>

</html>

<section class="work-panel" id="work-{{ include.key }}" aria-labelledby="work-heading-{{ include.key }}" data-work-category="{{ include.key }}">
  <h3 class="work-category-title" id="work-heading-{{ include.key }}">{{ include.title }}</h3>
  {% if include.items.size > 0 %}
  <div class="work-carousel" role="region" aria-roledescription="carousel" aria-label="{{ include.title }}">
    <div class="work-viewport" id="work-slides-{{ include.key }}" tabindex="0" aria-label="Browse {{ include.title | downcase }}">
      {% for item in include.items %}
      <div class="work-slide" role="group" aria-roledescription="slide" aria-label="{{ forloop.index }} of {{ include.items.size }}">
        {% include work-card.html item=item kind=include.key %}
      </div>
      {% endfor %}
    </div>
    <div class="work-controls" role="group" aria-label="Browse {{ include.title | downcase }}" hidden>
      <button class="work-dot-button" data-work-step="-1" type="button" aria-label="Previous {{ include.title | downcase }} item" aria-controls="work-slides-{{ include.key }}" title="Previous item">
        <span class="work-dot" aria-hidden="true"></span>
      </button>
      <span class="work-current" role="img" aria-label="Current item">
        <span class="work-progress-track" aria-hidden="true"><span class="work-progress-fill"></span></span>
      </span>
      <button class="work-dot-button" data-work-step="1" type="button" aria-label="Next {{ include.title | downcase }} item" aria-controls="work-slides-{{ include.key }}" title="Next item">
        <span class="work-dot" aria-hidden="true"></span>
      </button>
    </div>
    <span class="work-status" role="status" aria-live="polite" aria-atomic="true"></span>
  </div>
  {% else %}
  <div class="work-empty"><p>More {{ include.title | downcase }} to share soon.</p></div>
  {% endif %}
  <a class="work-archive-link" href="{{ include.archive | relative_url }}"><span>{{ include.archive_label }}</span><i class="fas fa-arrow-right" aria-hidden="true"></i></a>
</section>

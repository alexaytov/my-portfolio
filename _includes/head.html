{% include meta.html %}
{% assign font_weights = '400,500,600,700' | split: ',' %}
{% for weight in font_weights %}
<link rel="preload" href="{{ '/assets/fonts/poppins/poppins-latin-' | append: weight | append: '-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
{% endfor %}
<link rel="stylesheet" href="{% if site.baseurl %}{{site.baseurl}}{% else %}{% endif %}/assets/css/style.css">
<script src="https://kit.fontawesome.com/0b9fe3aa5f.js" crossorigin="anonymous" defer></script>
<link rel="shortcut icon" href="{% if site.favicon-url %}{{site.favicon-url}}{% else %}{{ 'assets/images/logo.png' | absolute_url }}{% endif %}" type="image/x-icon">

<!-- Content Security Policy -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://kit.fontawesome.com https://www.googletagmanager.com https://*.disqus.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://ka-f.fontawesome.com; img-src 'self' data: https: http:; connect-src 'self' https://ka-f.fontawesome.com;">
<script src="{{ '/assets/js/portfolio.js' | relative_url }}" defer></script>
